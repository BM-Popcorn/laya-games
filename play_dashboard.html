<!doctype html><meta charset="utf-8"><title>Laya Connect Four</title>
<style>body{margin:0;padding:24px;background:#0f172a;color:#e2e8f0;font:15px Segoe UI,Arial}main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:560px 1fr;gap:20px}.panel{background:#1e293b;border-radius:14px;padding:18px}.board{display:grid;grid-template-columns:repeat(7,62px);gap:7px;background:#155e75;padding:14px;border-radius:12px;width:max-content}.cell{width:62px;height:62px;border-radius:50%;background:#cbd5e1;cursor:pointer;box-shadow:inset 0 0 0 2px #0f172a}.yellow{background:#f59e0b!important}.red{background:#ef4444!important}button,select{padding:8px;border-radius:7px;border:0;background:#67e8f9;color:#082f49;font-weight:600}pre{white-space:pre-wrap;background:#020617;border-radius:8px;padding:12px;max-height:320px;overflow:auto}.muted{color:#94a3b8}.links{margin:18px 0}.links a{color:#67e8f9;margin-right:16px}</style>
<main><div class="top"><h1>Connect Four</h1><div><select id="mode" onchange="preload()"><option value="mock">Mock</option><option value="laya">Laya</option></select> <button onclick="reset()">New game</button></div></div><div class="links"><a href="connect4_dashboard.html">Decision view</a></div><div class="layout"><section class="panel"><h2>Board</h2><p id="status" class="muted">Your turn</p><div id="board" class="board"></div><p class="muted">You are yellow. Laya is red. Click a column.</p></section><section class="panel"><h2>What Laya is doing</h2><div id="summary" class="muted">No decision yet.</div><pre id="detail">Choose a column to begin.</pre></section></div></main>
<script>
let board=[], over=false;
const $=id=>document.getElementById(id);
function reset(){board=Array.from({length:6},()=>Array(7).fill(0));over=false;$('status').textContent='Your turn';$('summary').textContent='No decision yet.';$('detail').textContent='Choose a column to begin.';draw()}
function draw(){$('board').innerHTML=board.flatMap((row,r)=>row.map((v,c)=>`<div class="cell ${v===1?'yellow':v===2?'red':''}" onclick="human(${c})"></div>`)).join('')}
function legal(){return [...Array(7).keys()].filter(c=>!board[0][c])}
function drop(c,p){for(let r=5;r>=0;r--)if(!board[r][c]){board[r][c]=p;return}}
function won(p){for(let r=0;r<6;r++)for(let x=0;x<7;x++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]])if([...Array(4)].every((_,i)=>board[r+dr*i]?.[x+dc*i]===p))return true;return false}
function ended(){if(won(1)){over=true;$('status').textContent='You win!';return true}if(won(2)){over=true;$('status').textContent='Laya wins!';return true}if(!legal().length){over=true;$('status').textContent='Draw game';return true}return false}
async function human(c){if(over||!legal().includes(c))return;drop(c,1);draw();if(ended())return;await laya()}
async function laya(){$('status').textContent='Laya is thinking…';let actions=legal().map(c=>({id:`column_${c+1}`,description:`Drop a counter in column ${c+1}`}));let d=await ask({board,turn:'laya'},actions);if(!d)return;let finalCol=+d.action.split('_')[1]-1,modelCol=d.model_action?+d.model_action.split('_')[1]-1:finalCol,sc=d.strategy?.scores||{};$('summary').innerHTML=`<b>${d.action}</b> — ${d.reason}<br><span class="muted">Laya proposed column ${modelCol+1}; ${d.overridden?'the engine chose column '+(finalCol+1):'the engine agreed'}</span><br><span class="muted">search scores: ${Object.entries(sc).map(([k,v])=>k.split('_')[1]+'='+v).join(' ')}</span>`;drop(finalCol,2);draw();if(ended())return;$('status').textContent='Your turn'}
async function ask(state,actions){try{let r=await fetch('/api/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'connect4',mode:$('mode').value,state,actions,instruction:'Choose exactly one legal Connect Four column.'})});let d=await r.json();if(d.error)throw Error(d.error);$('detail').textContent=JSON.stringify(d,null,2);return d}catch(e){$('status').textContent='Decision error: '+e.message;return null}}
function preload(){if($('mode').value!=='laya')return;$('status').textContent='Preparing Laya…';fetch('/api/preload',{method:'POST'}).then(r=>r.json()).then(x=>$('status').textContent=x.ready?'Laya ready — your turn':'Laya load error')}
reset();
</script>
