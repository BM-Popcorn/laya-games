<!doctype html><html><head><meta charset="utf-8"><title>Laya Connect Four — decisions</title>
<style>body{font:15px Segoe UI,Arial;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}main{max-width:1000px;margin:auto}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(7,58px);gap:7px;background:#155e75;padding:14px;width:max-content;border-radius:12px}.cell{width:58px;height:58px;border-radius:50%;background:#cbd5e1;box-shadow:inset 0 0 0 2px #0f172a}.human{background:#f59e0b}.laya{background:#ef4444}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.card{background:#1e293b;padding:14px 16px;border-radius:10px;min-width:180px}.muted{color:#94a3b8}pre{white-space:pre-wrap;background:#020617;padding:14px;border-radius:10px;max-height:300px;overflow:auto}table{width:100%;border-collapse:collapse;background:#1e293b}td,th{padding:8px;border-bottom:1px solid #334155;text-align:left;font-size:13px}</style></head>
<body><main><h1>Laya Connect Four</h1><div id="status" class="muted">Waiting for a game…</div><div class="cards"><div class="card"><div class="muted">Latest choice</div><strong id="choice">—</strong></div><div class="card"><div class="muted">Model proposal</div><strong id="model">—</strong></div><div class="card"><div class="muted">Why</div><strong id="why">—</strong></div><div class="card"><div class="muted">Confidence</div><strong id="confidence">—</strong></div></div><div id="board" class="grid"></div><h2>Decision detail</h2><pre id="detail">No Laya move yet.</pre><h2>Move history</h2><table><thead><tr><th>Move</th><th>Player</th><th>Column</th><th>Explanation</th></tr></thead><tbody id="history"></tbody></table></main>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function refresh(){try{let s=await (await fetch('connect4_state.json?'+Date.now())).json(); let d=s.latest_decision;
 $('status').textContent=`${s.players} · ${s.moves.length} moves · updated ${new Date(s.updated_at).toLocaleTimeString()}`;
 $('board').innerHTML=s.board.flat().map(v=>`<div class="cell ${v===1?'human':v===2?'laya':''}"></div>`).join('');
 if(d){$('choice').textContent=d.recommended_action;$('model').textContent=d.model_action||'—';$('why').textContent=d.reason||'—';$('confidence').textContent=typeof d.confidence==='number'?(d.confidence*100).toFixed(1)+'%':'uncalibrated';$('detail').textContent=JSON.stringify(d,null,2)}
 $('history').innerHTML=s.moves.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.player)} ${m.colour?`(${m.colour})`:''}</td><td>${m.column}</td><td>${esc(m.decision?.reason||'Human move')}</td></tr>`).join('');
 }catch(e){$('status').textContent='Start the Connect Four game to populate this view.'}}
refresh();setInterval(refresh,1000);
</script></body></html>
